<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Habits Organizer</title>
  <desc id="desc">A calm, ascending habit path with seven soft chakra-colored points and a lowercase ho monogram.</desc>
  <defs>
    <linearGradient id="habitPath" x1="130" y1="355" x2="381" y2="153" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087F73"/>
      <stop offset="1" stop-color="#28A58D"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#165F58" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="132" fill="#F8FAF7"/>
  <!-- Seven gentle color notes form a quiet ascending halo. -->
  <g opacity=".72">
    <circle cx="104" cy="335" r="19" fill="#E98A91"/>
    <circle cx="145" cy="279" r="18" fill="#F2B27D"/>
    <circle cx="198" cy="232" r="17" fill="#E8CB77"/>
    <circle cx="257" cy="198" r="16" fill="#88C7A4"/>
    <circle cx="319" cy="172" r="15" fill="#84C4D7"/>
    <circle cx="378" cy="149" r="14" fill="#9B9FD2"/>
    <circle cx="427" cy="121" r="13" fill="#B89ACD"/>
  </g>
  <!-- The daily path rises in small, repeatable steps and closes into a loop. -->
  <path d="M91 357c27-1 43-16 59-36l44-53c17-20 35-30 55-30 20 0 33 12 33 30 0 20-16 35-37 35-15 0-27-7-34-19" fill="none" stroke="url(#habitPath)" stroke-linecap="round" stroke-linejoin="round" stroke-width="24"/>
  <path d="m286 276 27-25 5 36" fill="none" stroke="#168C7D" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
  <g filter="url(#softShadow)">
    <rect x="123" y="323" width="266" height="104" rx="46" fill="#FFFFFF"/>
    <text x="256" y="399" text-anchor="middle" fill="#126F65" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="91" font-weight="800" letter-spacing="-8">ho</text>
  </g>
</svg>
